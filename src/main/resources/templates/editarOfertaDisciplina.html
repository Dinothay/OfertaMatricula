<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Oferta de Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Oferta de Disciplina</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarOfertaDisciplina}" method="POST">
                    <input type="hidden" name="id" th:value="${OfertaDisciplina.id}">

                    <div class="form-grid">
                        <div class="field">
                            <label for="idDisciplina">Disciplina</label>
                            <select name="idDisciplina" id="idDisciplina" required>
                                <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.nome}"
                                    th:selected="${disciplina.id == OfertaDisciplina.disciplina.id}">
                                </option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="idProfessor">Professor</label>
                            <select name="idProfessor" id="idProfessor" required>
                                <option th:each="professor : ${professores}" th:value="${professor.id}" th:text="${professor.nome}"
                                    th:selected="${professor.id == OfertaDisciplina.professor.id}">
                                </option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="diaAula">Dia da aula</label>
                            <select name="diaAula" id="diaAula">
                                <option value="Segunda-feira" th:selected="${OfertaDisciplina.diaAula == 'Segunda-feira'}">Segunda-feira</option>
                                <option value="Terça-feira" th:selected="${OfertaDisciplina.diaAula == 'Terça-feira'}">Terça-feira</option>
                                <option value="Quarta-feira" th:selected="${OfertaDisciplina.diaAula == 'Quarta-feira'}">Quarta-feira</option>
                                <option value="Quinta-feira" th:selected="${OfertaDisciplina.diaAula == 'Quinta-feira'}">Quinta-feira</option>
                                <option value="Sexta-feira" th:selected="${OfertaDisciplina.diaAula == 'Sexta-feira'}">Sexta-feira</option>
                                <option value="Sábado" th:selected="${OfertaDisciplina.diaAula == 'Sábado'}">Sábado</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="nAulaSemana">Número de aulas por semana</label>
                            <input type="number" name="nAulaSemana" id="nAulaSemana" min="1" th:value="${OfertaDisciplina.nAulaSemana}" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaOfertaDisciplinas}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
            
        </body>

        </html>
