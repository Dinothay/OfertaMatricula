<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Oferta de Disciplina | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaOfertaDisciplinas}">Ver ofertas</a>
                <a th:href="@{/index}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Editar oferta de disciplina</h2>
                    <p class="subtitle">Atualize a oferta de disciplina cadastrada.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaOfertaDisciplinas}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarOfertaDisciplina}" method="POST">
                <input type="hidden" name="id" th:value="${ofertaDisciplina.id}">

                <label for="idDisciplina">Disciplina:</label>
                <select name="idDisciplina" id="idDisciplina" required>
                    <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.nome}"
                        th:selected="${disciplina.id == ofertaDisciplina.disciplina.id}">
                    </option>
                </select>

                <label for="idProfessor">Professor:</label>
                <select name="idProfessor" id="idProfessor" required>
                    <option th:each="professor : ${professores}" th:value="${professor.id}" th:text="${professor.nome}"
                        th:selected="${professor.id == ofertaDisciplina.professor.id}">
                    </option>
                </select>

                <label for="diaAula">Dia da aula:</label>
                <select name="diaAula" id="diaAula">
                    <option value="Segunda-feira" th:selected="${ofertaDisciplina.diaAula == 'Segunda-feira'}">Segunda-feira</option>
                    <option value="Terça-feira" th:selected="${ofertaDisciplina.diaAula == 'Terça-feira'}">Terça-feira</option>
                    <option value="Quarta-feira" th:selected="${ofertaDisciplina.diaAula == 'Quarta-feira'}">Quarta-feira</option>
                    <option value="Quinta-feira" th:selected="${ofertaDisciplina.diaAula == 'Quinta-feira'}">Quinta-feira</option>
                    <option value="Sexta-feira" th:selected="${ofertaDisciplina.diaAula == 'Sexta-feira'}">Sexta-feira</option>
                </select>

                <label for="nAulaSemana">Número de aulas por semana:</label>
                <input type="number" name="nAulaSemana" id="nAulaSemana" min="1" th:value="${ofertaDisciplina.nAulaSemana}" required>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaOfertaDisciplinas}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
