<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Empréstimo | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaEmprestimo}">Ver empréstimos</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Editar empréstimo</h2>
                <p class="subtitle">Atualize as informações do empréstimo.</p>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarEmprestimo}" th:method="POST">
                <input type="hidden" name="id" th:value="${emprestimo.id}">

                <label for="dataRetirada">Data de retirada:</label>
                <input type="date" name="dataRetirada" id="dataRetirada" th:value="${emprestimo.dataRetirada}" required>

                <label for="dataPrevista">Data prevista:</label>
                <input type="date" name="dataPrevista" id="dataPrevista" th:value="${emprestimo.dataPrevista}" required>

                <label for="dataDevolucao">Data de devolução:</label>
                <input type="date" name="dataDevolucao" id="dataDevolucao" th:value="${emprestimo.dataDevolucao}">

                <label for="status">Status:</label>
                <input type="text" name="status" id="status" th:value="${emprestimo.status}" required>

                <label for="renovacoes">Renovações:</label>
                <input type="number" name="renovacoes" id="renovacoes" th:value="${emprestimo.renovacoes}" required>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaEmprestimo}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
