<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar login-topbar">
        <nav class="nav">
            <div class="brand" aria-label="Oferta">
                <span class="brand-mark">O</span> Oferta
            </div>

            <div class="nav-links">
                <span class="nav-placeholder">Acesso ao sistema</span>
            </div>

            <div class="nav-actions"></div>
        </nav>
    </header>

    <div class="login-page">
        <div class="form-shell login-shell">
            <div class="form-header">
                <h2>Login</h2>
            </div>
            <div class="form-body">
                <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>
                <form th:action="@{/login}" method="POST">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="username">Usuário</label>
                            <input type="text" name="username" id="username" th:value="${username}" required>
                        </div>
                        <div class="field full">
                            <label for="password">Senha</label>
                            <input type="password" name="password" id="password">
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
