<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Login</h2>
            </div>
            <div class="form-body">
                <div th:if="${mensagem}"th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'">
                    <p th:text="${mensagem}"></p>
                </div>
                <form th:action="@{/entrar}" method="POST">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="login">Login</label>
                            <input type="text"name="login"id="login"th:value="${login}"required>
                        </div>
                        <div class="field full">
                            <label for="senhaHash">Senha</label>
                            <input type="password"name="senhaHash"id="senhaHash"required>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
