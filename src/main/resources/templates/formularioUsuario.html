<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaUsuarios}">Ver usuários</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Sistema</p>
                <h2>Novo usuário</h2>
                <p class="subtitle">Adicione um usuário ao sistema.</p>
            </div>
        </div>

        <section class="card form-card">
            <div class="alert" th:if="${mensagem}" th:text="${mensagem}"></div>

            <form th:action="@{/cadastrarUsuarios}" method="POST">
                <label for="login">Informe o login:</label>
                <input type="text" name="login" id="login" th:value="${login}" placeholder="Digite o login" required>

                <label for="senhaHash">Informe a senha:</label>
                <input type="password" name="senhaHash" id="senhaHash" placeholder="Digite a senha" required>

                <label for="papel">Selecione o tipo de usuário:</label>
                <select name="papel" id="papel" required>
                    <option value="" disabled th:selected="${papel == null}">Selecione o tipo</option>
                    <option th:each="p : ${papeis}" th:value="${p}" th:text="${p}" th:selected="${papel == p}"></option>
                </select>

                <label for="fotoPerfil">Informe a foto de perfil:</label>
                <input type="text" name="fotoPerfil" id="fotoPerfil" th:value="${fotoPerfil}" placeholder="Caminho da foto (opcional)">

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaUsuarios}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
