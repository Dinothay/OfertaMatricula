<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Cadastrar Usuário</h2>
            </div>
            <div class="form-body">
                <div th:if="${mensagem}"th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'"><p th:text="${mensagem}"></p></div><form th:action="@{/cadastrarUsuarios}" method="POST">
                    <div class="form-grid">
                        <div class="field"><label for="login">Login</label>
                            <input type="text"name="login"id="login"th:value="${login}"placeholder="Digite o login"required>
                        </div>
                        <div class="field">
                            <label for="senhaHash">Senha</label>
                            <input type="password"name="senhaHash"id="senhaHash"placeholder="Digite a senha"required>
                        </div>
                        <div class="field">
                            <label for="papel">Tipo de usuário</label>
                            <select name="papel" id="papel" required>
                                <option value="" disabled th:selected="${papel == null}">
                                    Selecione o tipo
                                </option>
                                <option th:each="p : ${papeis}"th:value="${p}"th:text="${p}"th:selected="${papel == p}">
                                </option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="fotoPerfil">Foto de perfil</label>
                            <input type="text"name="fotoPerfil"id="fotoPerfil"th:value="${fotoPerfil}"placeholder="Caminho da foto (opcional)">
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                        <a th:href="@{/listaUsuarios}"class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
