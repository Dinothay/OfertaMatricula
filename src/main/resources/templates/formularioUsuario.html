<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark">O</span> Oferta
            </a>

            <div class="nav-links">
                <a th:href="@{/listaUsuarios}">Ver usuários</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="page">
        <div class="page-header-shell">
            <div class="page-header-inner">
                <div>
                    <p class="eyebrow">Sistema</p>
                    <h1 class="page-title">Novo usuário</h1>
                    <p class="page-subtitle">Adicione um usuário ao sistema e defina seu perfil de acesso.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaUsuarios}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="form-shell">
            <div class="form-header">
                <p class="eyebrow">Cadastro</p>
                <h2>Adicionar usuário</h2>
            </div>

            <div class="form-body">
                <div th:if="${mensagem}"
                    th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'"
                    th:text="${mensagem}">
                </div>

                <form th:action="@{/cadastrarUsuarios}" method="POST" enctype="multipart/form-data">
                    <div class="field">
                        <label for="username">Nome de usuário</label>
                        <input type="text" name="username" id="username" th:value="${username}"
                            placeholder="Digite o nome de usuário" required>
                    </div>

                    <div class="field">
                        <label for="password">Senha</label>
                        <input type="password" name="password" id="password" placeholder="Digite a senha" required>
                    </div>

                    <div class="field full">
                        <label for="papel">Tipo de usuário</label>
                        <select name="papel" id="papel" required>
                            <option value="" disabled th:selected="${papel == null}">
                                Selecione o tipo
                            </option>

                            <option th:each="p : ${papeis}" th:value="${p}" th:text="${p}" th:selected="${papel == p}">
                            </option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="fotoPerfil">Foto de perfil</label>
                        <input type="file" name="fotoPerfil" id="fotoPerfil" accept="image/*">
                    </div>

                    <div class="actions">
                        <button type="submit">Cadastrar</button>
                        <a class="button secondary" th:href="@{/listaUsuarios}">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
