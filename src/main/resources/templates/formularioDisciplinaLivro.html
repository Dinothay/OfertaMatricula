<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associar disciplina e livro | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaDisciplinaLivro}">Ver associações</a>
                <a th:href="@{/listaDisciplinas}">Disciplinas</a>
                <a th:href="@{/listaLivro}">Livros</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Associar livro à disciplina</h2>
                <p class="subtitle">Vincule um livro ao conjunto curricular da disciplina.</p>
            </div>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <section class="card form-card">
            <form th:action="@{/cadastrarDisciplinaLivro}" method="POST">
                <label for="disciplinaId">Selecione a disciplina:</label>
                <select name="disciplinaId" id="disciplinaId" required>
                    <option value="" disabled selected>Escolha a disciplina</option>
                    <option th:each="disciplina : ${disciplinas}"
                            th:value="${disciplina.id}"
                            th:text="${disciplina.nome}">
                    </option>
                </select>

                <label for="livroId">Selecione o livro:</label>
                <select name="livroId" id="livroId" required>
                    <option value="" disabled selected>Escolha o livro</option>
                    <option th:each="livro : ${livros}"
                            th:value="${livro.id}"
                            th:text="${livro.titulo}">
                    </option>
                </select>

                <label for="tipo">Tipo de leitura:</label>
                <select name="tipo" id="tipo" required>
                    <option value="BASICA">Básica</option>
                    <option value="COMPLEMENTAR">Complementar</option>
                </select>

                <div class="botoes">
                    <button type="submit">Cadastrar associação</button>
                    <a class="button secondary" th:href="@{/listaDisciplinaLivro}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
