<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Exemplar | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark">O</span> Oferta
            </a>

            <div class="nav-links">
                <a th:href="@{/listaExemplar}">Ver exemplares</a>
                <a th:href="@{/index}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">

        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Biblioteca</p>
                    <h2>Novo exemplar</h2>
                    <p class="subtitle">Registre um exemplar físico de um livro.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaExemplar}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">

            <form th:action="@{/cadastraExemplar}" method="POST">

                <label for="tombo">Tombo:</label>

                <input type="text" name="tombo" id="tombo" required>

                <label for="status">Status do exemplar:</label>

                <select name="status" id="status" required>

                    <option value="">Selecione o status</option>

                    <option th:each="status : ${T(com.example.OfertaMatricula.Model.StatusExemplar).values()}"
                        th:value="${status}" th:text="${status}">
                    </option>

                </select>

                <label for="idLivro">Livro:</label>

                <select name="idLivro" id="idLivro" required>

                    <option value="">Selecione um livro</option>

                    <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}">
                    </option>

                </select>

                <div class="botoes">

                    <button type="submit">
                        Cadastrar
                    </button>

                    <a class="button secondary" th:href="@{/listaExemplar}">
                        Voltar
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
