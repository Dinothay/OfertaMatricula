<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar curso | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaCursos}">Ver cursos</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Acadêmico</p>
                <h2>Editar curso</h2>
            </div>
        </div>

        <section class="card form-card">
            <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

            <form th:action="@{/atualizarCurso}" th:method="POST">
                <input type="hidden" name="id" th:value="${curso.id}">

                <label for="nome">Informe o nome:</label>
                <input type="text" name="nome" id="nome" th:value="${curso.nome}" required>

                <label for="semestres">Informe a quantidade de semestres:</label>
                <input type="number" name="semestres" id="semestres" th:value="${curso.semestres}" required>

                <label for="nDisciplinas">Informe o número de disciplinas:</label>
                <input type="number" name="nDisciplinas" id="nDisciplinas" th:value="${curso.nDisciplinas}" required>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a class="button secondary" th:href="@{/listaCursos}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
