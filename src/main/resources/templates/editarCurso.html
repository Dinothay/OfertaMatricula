<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Curso</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Curso</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarCurso}" th:method="POST">
                    <input type="hidden" name="id" th:value="${curso.id}">

                    <div class="form-grid">
                        <div class="field full">
                            <label for="nome">Nome</label>
                            <input type="text" name="nome" id="nome" th:value="${curso.nome}">
                        </div>

                        <div class="field">
                            <label for="semestres">Semestres</label>
                            <input type="number" name="semestres" id="semestres" th:value="${curso.semestres}">
                        </div>

                        <div class="field">
                            <label for="nDisciplinas">Número de disciplinas</label>
                            <input type="number" name="nDisciplinas" id="nDisciplinas" th:value="${curso.nDisciplinas}">
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaCursos}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
