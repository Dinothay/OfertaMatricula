<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/listaDisciplinaLivro}">Associações</a>
                <a th:href="@{/listaExemplar}">Exemplares</a>
                <a th:href="@{/listaEmprestimo}">Empréstimos</a>
                <a th:href="@{/listaReserva}">Reservas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Livros</h2>
                <p class="subtitle">Acervo cadastrado no sistema.</p>
            </div>
            <a class="button" th:href="@{/livro}">+ Novo livro</a>
        </div>

        <div th:if="${#lists.isEmpty(listaLivro)}" class="empty-state">
            <h2>Nenhum livro cadastrado</h2>
            <p>Cadastre o primeiro livro para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaLivro)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                        <th>Edição</th>
                        <th>Capa</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="livro : ${listaLivro}">
                        <td th:text="${livro.id}"></td>
                        <td th:text="${livro.titulo}"></td>
                        <td th:text="${livro.autor}"></td>
                        <td th:text="${livro.isbn}"></td>
                        <td th:text="${livro.edicao}"></td>
                        <td>
                            <img th:src="@{${livro.capalmagem}}" alt="Capa do livro" style="width: 80px; height: 110px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td>
                            <div class="actions">
                                <a class="button secondary" th:href="@{/editarLivro/{id}(id=${livro.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirLivro/{id}(id=${livro.id})}">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <a class="floating-back-btn" th:href="@{/biblioteca}">⬅ Voltar</a>
</body>

</html>
