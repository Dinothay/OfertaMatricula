<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/listaDisciplinaLivro}">Associações</a>
                <a th:href="@{/listaEmprestimo}">Empréstimos</a>
                <a th:href="@{/listaReserva}">Reservas</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Livros</h2>
                <p class="subtitle">Acervo cadastrado no sistema.</p>
            </div>
            <a th:if="${usuarioLogado != null and usuarioLogado.papel != null and (usuarioLogado.papel.name() == 'ADMIN' or usuarioLogado.papel.name() == 'BIBLIOTECARIO')}" class="button" th:href="@{/livro}">+ Novo livro</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaLivro)}" class="empty-state">
            <h2>Nenhum livro cadastrado</h2>
            <p>Cadastre o primeiro livro para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaLivro)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                        <th>Edição</th>
                        <th>Status</th>
                        <th>Capa</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="livro : ${listaLivro}">
                        <td th:text="${livro.id}"></td>
                        <td th:text="${livro.titulo}"></td>
                        <td th:text="${livro.autor}"></td>
                        <td th:text="${livro.isbn}"></td>
                        <td th:text="${livro.edicao}"></td>
                        <td th:text="${livro.status != null ? livro.status : 'Sem status'}"></td>
                        <td>
                            <img th:src="@{${livro.capalmagem}}" alt="Capa do livro" style="width: 80px; height: 110px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td>
                            <div th:if="${usuarioLogado != null and usuarioLogado.papel != null and (usuarioLogado.papel.name() == 'ADMIN' or usuarioLogado.papel.name() == 'BIBLIOTECARIO')}" class="actions">
                                <a class="button secondary" th:href="@{/editarLivro/{id}(id=${livro.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirLivro/{id}(id=${livro.id})}">Excluir</a>
                            </div>

                            <div th:if="${usuarioLogado != null and usuarioLogado.papel != null and (usuarioLogado.papel.name() == 'ALUNO' or usuarioLogado.papel.name() == 'PROFESSOR') and livro.status.name() != 'MANUTENCAO'}" class="actions">
                                <form th:if="${livro.status.name() == 'DISPONIVEL'}" th:action="@{/pegarLivroEmprestimo/{id}(id=${livro.id})}" method="post">
                                    <button type="submit" class="button">Pegar emprestado</button>
                                </form>
                                <form th:if="${livro.status.name() == 'EMPRESTADO' or livro.status.name() == 'RESERVADO'}" th:action="@{/reservarLivro/{id}(id=${livro.id})}" method="post">
                                    <button type="submit" class="button secondary">Reservar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <a class="floating-back-btn" th:href="@{/biblioteca}">← Voltar</a>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>

</html>
