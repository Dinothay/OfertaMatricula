<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar usuário | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}">
                <span class="brand-mark">O</span> Oferta
            </a>

            <div class="nav-links">
                <a th:href="@{/listaUsuarios}">Ver usuários</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">

        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Sistema</p>
                <h2>Editar usuário</h2>
            </div>
        </div>

        <section class="card form-card">

            <div th:if="${mensagem}"
                 th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'"
                 th:text="${mensagem}">
            </div>

            <form th:action="@{/atualizarUsuario}" method="POST" enctype="multipart/form-data">

                <input type="hidden" name="id" th:value="${usuario.id}">

                <label for="login">Informe o login:</label>
                <input type="text" name="login" id="login" th:value="${usuario.login}" required>

                <label for="senhaHash">Informe a senha:</label>
                <input type="password" name="senhaHash" id="senhaHash" th:value="${usuario.senhaHash}" required>

                <label for="papel">Selecione o tipo de usuário:</label>
                <select name="papel" id="papel" required>
                    <option th:each="papel : ${papeis}"
                            th:value="${papel}"
                            th:text="${papel}"
                            th:selected="${papel == usuario.papel}">
                    </option>
                </select>

                <label for="fotoPerfil">Nova foto de perfil:</label>
                <input type="file" name="fotoPerfil" id="fotoPerfil" accept="image/*">

                <div th:if="${usuario.fotoPerfil != null}">
                    <p>Foto atual:</p>
                    <img th:src="@{'/' + ${usuario.fotoPerfil}}" alt="Foto de perfil" style="max-width: 150px;">
                </div>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a class="button secondary" th:href="@{/listaUsuarios}">Cancelar</a>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
