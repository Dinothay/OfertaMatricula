<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Usuário</h2>
            </div>
            <div class="form-body">
                <div th:if="${mensagem}"
                     th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'">
                    <p th:text="${mensagem}"></p>
                </div>
                <form th:action="@{/atualizarUsuario}" method="POST">
                    <input type="hidden" name="id" th:value="${usuario.id}">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="login">Login</label>
                            <input type="text"name="login"id="login"th:value="${usuario.login}"required>
                        </div>
                        <div class="field full">
                            <label for="senhaHash">Senha</label>
                            <input type="password" name="senhaHash"id="senhaHash"th:value="${usuario.senhaHash}"required>
                        </div>
                        <div class="field">
                            <label for="papel">Tipo de usuário</label>
                            <select name="papel" id="papel" required>
                                <option th:each="papel : ${papeis}"
                                        th:value="${papel}"
                                        th:text="${papel}"
                                        th:selected="${papel == usuario.papel}">
                                </option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="fotoPerfil">Foto de perfil</label>
                            <input type="text"name="fotoPerfil"id="fotoPerfil"th:value="${usuario.fotoPerfil}">
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaUsuarios}"class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
