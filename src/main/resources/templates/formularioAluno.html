<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaAlunos}">Ver alunos</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Pessoas</p>
                <h2>Novo aluno</h2>
                <p class="subtitle">Adicione um estudante ao sistema.</p>
            </div>
        </div>

        <section class="card form-card">
            <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>
            <form th:method="POST" th:action="@{/cadastrarAlunos}">
                <label for="nome">Informe o nome:</label>
                <input type="text" th:name="nome" id="nome" th:value="${nome}" required>

                <label for="cpf">Informe o CPF:</label>
                <input type="text" th:name="cpf" id="cpf" th:value="${cpf}" inputmode="numeric" maxlength="14" pattern="[0-9.\-]{11,14}" title="Informe um CPF válido, com 11 dígitos." required>

                <label for="email">Informe o e-mail:</label>
                <input type="email" th:name="email" id="email" th:value="${email}" required>

                <label for="telefone">Informe o telefone:</label>
                <input type="text" th:name="telefone" id="telefone" th:value="${telefone}" required>

                <label for="prontuario">Informe o prontuário:</label>
                <input type="number" th:name="prontuario" id="prontuario" th:value="${prontuario}" min="1" required>

                <label for="endereco">Informe o endereço:</label>
                <input type="text" th:name="endereco" id="endereco" th:value="${endereco}" required>

                <label for="dataInicio">Informe a data de início:</label>
                <input type="date" th:name="dataInicio" id="dataInicio" th:value="${dataInicio != null ? dataInicio : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" readonly required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaAlunos}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
