<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Cadastrar Aluno</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/cadastrarAlunos}" th:method="POST">
                    <div class="form-grid">
                        <div class="field">
                            <label for="nome">Nome</label>
                            <input type="text" name="nome" id="nome" placeholder="Digite o nome completo" required>
                        </div>

                        <div class="field">
                            <label for="cpf">CPF</label>
                            <input type="text" name="cpf" id="cpf" placeholder="Digite o CPF" required>
                        </div>

                        <div class="field">
                            <label for="prontuario">Prontuário</label>
                            <input type="number" name="prontuario" id="prontuario" placeholder="Número do prontuário" required>
                        </div>

                        <div class="field full">
                            <label for="endereco">Endereço</label>
                            <input type="text" name="endereco" id="endereco" placeholder="Digite o endereço" required>
                        </div>

                        <div class="field">
                            <label for="dataInicio">Data de início</label>
                            <input type="date" name="dataInicio" id="dataInicio" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                        <a th:href="@{/listaAlunos}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
</body>

</html>
