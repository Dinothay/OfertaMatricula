<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link rel="stylesheet" th:href="@{/css/lista.css}">
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">Lista de Usuários</div>
            <div class="nav-actions">
                <a th:href="@{/index}" class="btn btn-secondary">Voltar ao início</a>
                <a th:href="@{/usuario}" class="btn btn-primary">Cadastrar usuário</a>
            </div>
        </header>
        <div th:if="${mensagem}"
             th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'">
            <p th:text="${mensagem}"></p>
        </div>
        <div th:if="${#lists.isEmpty(listaUsuarios)}" class="empty-state">
            <h2>Nenhum usuário cadastrado</h2>
            <p>Cadastre o primeiro usuário para começar.</p>
        </div>
        <div th:unless="${#lists.isEmpty(listaUsuarios)}" class="table-wrap">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Login</th>
                        <th>Tipo de usuário</th>
                        <th>Foto de perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${listaUsuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.login}"></td>
                        <td th:text="${usuario.papel}"></td>
                        <td th:text="${usuario.fotoPerfil}"></td>
                        <td>
                            <div class="actions-inline">
                                <form th:action="@{/editarUsuario/{id}(id=${usuario.id})}"method="GET">
                                    <button type="submit" class="btn btn-secondary">Editar</button>
                                </form>
                                <form th:action="@{/excluirUsuario/{id}(id=${usuario.id})}"method="GET">
                                    <button type="submit"class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
