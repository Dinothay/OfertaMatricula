<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/usuario}">Novo usuário</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Sistema</p>
                <h2>Usuários</h2>
                <p class="subtitle">Usuários cadastrados no sistema.</p>
            </div>
            <a class="button" th:href="@{/usuario}">+ Novo usuário</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'"
            th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaUsuarios)}" class="empty-state">
            <h2>Nenhum usuário cadastrado</h2>
            <p>Cadastre o primeiro usuário para começar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaUsuarios)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Login</th>
                    <th>Tipo de usuário</th>
                    <th>Foto de perfil</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="usuario : ${listaUsuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.login}"></td>
                    <td th:text="${usuario.papel}"></td>
                    <td>
                        <img th:if="${usuario.fotoPerfil != null}" th:src="@{'/' + ${usuario.fotoPerfil}}"
                            alt="Foto de perfil" style="width: 60px; height: 60px; object-fit: cover;">

                        <span th:if="${usuario.fotoPerfil == null}">
                            Sem foto
                        </span>
                    </td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarUsuario/{id}(id=${usuario.id})}">
                                Editar
                            </a>

                            <a class="button danger" th:href="@{/excluirUsuario/{id}(id=${usuario.id})}">
                                Excluir
                            </a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">⬅ Voltar</a>
</body>

</html>
