<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplares | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/listaLivro}">Livros</a>
                <a th:href="@{/listaEmprestimo}">Empréstimos</a>
                <a th:href="@{/listaReserva}">Reservas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Exemplares</h2>
                <p class="subtitle">Itens físicos cadastrados no acervo.</p>
            </div>
            <a class="button" th:href="@{/exemplar}">+ Novo exemplar</a>
        </div>

        <div th:if="${#lists.isEmpty(listaExemplar)}" class="empty-state">
            <h2>Nenhum exemplar cadastrado</h2>
            <p>Cadastre o primeiro exemplar para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaExemplar)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tombo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exemplar : ${listaExemplar}">
                        <td th:text="${exemplar.id}"></td>
                        <td th:text="${exemplar.tombo}"></td>
                        <td th:text="${exemplar.status != null ? exemplar.status.status : 'Sem status'}"></td>
                        <td>
                            <div class="actions">
                                <a class="button secondary" th:href="@{/editarExemplar/{id}(id=${exemplar.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirExemplar/{id}(id=${exemplar.id})}">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
