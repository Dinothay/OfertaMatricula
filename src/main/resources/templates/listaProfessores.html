<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/professor}">Novo professor</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Docentes</p>
                <h2>Professores</h2>
                <p class="subtitle">Professores cadastrados no sistema.</p>
            </div>
            <a class="button" th:href="@{/professor}">+ Novo professor</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaProfessores)}" class="empty-state">
            <h2>Nenhum professor cadastrado</h2>
            <p>Cadastre o primeiro professor para começar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaProfessores)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Área</th>
                    <th>Formação</th>
                    <th>Endereço</th>
                    <th>Salário</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="professor : ${listaProfessores}">
                    <td th:text="${professor.id}"></td>
                    <td th:text="${professor.nome}"></td>
                    <td th:text="${professor.cpf}"></td>
                    <td th:text="${professor.email}"></td>
                    <td th:text="${professor.telefone}"></td>
                    <td th:text="${professor.area}"></td>
                    <td th:text="${professor.formacao}"></td>
                    <td th:text="${professor.endereco}"></td>
                    <td th:text="${professor.salario}"></td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarProfessor/{id}(id=${professor.id})}">Editar</a>
                            <a class="button danger" th:href="@{/excluirProfessor/{id}(id=${professor.id})}">Excluir</a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">⬅ Voltar</a>
</body>
</html>
