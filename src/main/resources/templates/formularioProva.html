<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Prova</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Cadastrar Prova</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/cadastraProva}" method="POST">
                    <div class="form-grid">
                        <div class="field">
                            <label for="data">Data</label>
                            <input type="date" name="data" id="data" required>
                        </div>

                        <div class="field">
                            <label for="peso">Peso</label>
                            <input type="number" step="0.01" name="peso" id="peso" placeholder="Digite o peso" required>
                        </div>

                        <div class="field full">
                            <label for="conteudo">Conteúdo</label>
                            <input type="text" name="conteudo" id="conteudo" placeholder="Digite o conteúdo da prova" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Criar</button>
                        <a th:href="@{/listaProva}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
