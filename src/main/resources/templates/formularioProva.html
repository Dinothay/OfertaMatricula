<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Prova | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaProva}">Ver provas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Nova prova</h2>
                    <p class="subtitle">Cadastre uma nova avaliação.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaProva}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/cadastraProva}" method="POST">
                <label for="data">Data:</label>
                <input type="date" name="data" id="data" required>

                <label for="peso">Peso:</label>
                <input type="number" step="0.01" name="peso" id="peso" placeholder="Digite o peso" required>

                <label for="conteudo">Conteúdo:</label>
                <input type="text" name="conteudo" id="conteudo" placeholder="Digite o conteúdo da prova" required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaProva}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
