<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar professor | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaProfessores}">Ver professores</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Docentes</p>
                    <h2>Editar professor</h2>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaProfessores}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

            <form th:action="@{/atualizarProfessor}" method="POST">
                <input type="hidden" name="id" th:value="${professor.id}">

                <label for="nome">Informe o nome:</label>
                <input type="text" name="nome" id="nome" th:value="${nome != null ? nome : professor.nome}" required>

                <label for="cpf">Informe o CPF:</label>
                <input type="text" name="cpf" id="cpf" th:value="${cpf != null ? cpf : professor.cpf}" title="Informe o CPF no formato 123.456.789-09" required>

                <label for="email">Informe o e-mail:</label>
                <input type="email" name="email" id="email" th:value="${email != null ? email : professor.email}" required>

                <label for="telefone">Informe o telefone:</label>
                <input type="tel" name="telefone" id="telefone" th:value="${telefone != null ? telefone : professor.telefone}" title="Informe o telefone com DDD e 10 ou 11 dígitos" required>

                <label for="area">Informe a área:</label>
                <input type="text" name="area" id="area" th:value="${professor.area}" required>

                <label for="formacao">Informe a formação:</label>
                <input type="text" name="formacao" id="formacao" th:value="${professor.formacao}" required>

                <label for="endereco">Informe o endereço:</label>
                <input type="text" name="endereco" id="endereco" th:value="${professor.endereco}" required>

                <label for="salario">Informe o salário:</label>
                <input type="number" step="0.01" name="salario" id="salario" th:value="${professor.salario}" required>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a class="button secondary" th:href="@{/listaProfessores}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
