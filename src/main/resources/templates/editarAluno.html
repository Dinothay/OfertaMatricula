<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluno</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Aluno</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarAluno}" th:method="POST">
                    <input type="hidden" name="id" th:value="${aluno.id}">

                    <div class="form-grid">
                        <div class="field full">
                            <label for="nome">Nome</label>
                            <input type="text" name="nome" id="nome" th:value="${aluno.nome}">
                        </div>

                        <div class="field">
                            <label for="cpf">CPF</label>
                            <input type="text" name="cpf" id="cpf" th:value="${aluno.cpf}">
                        </div>

                        <div class="field">
                            <label for="prontuario">Prontuário</label>
                            <input type="number" name="prontuario" id="prontuario" th:value="${aluno.prontuario}">
                        </div>

                        <div class="field full">
                            <label for="endereco">Endereço</label>
                            <input type="text" name="endereco" id="endereco" th:value="${aluno.endereco}">
                        </div>

                        <div class="field">
                            <label for="dataInicio">Data de início</label>
                            <input type="date" name="dataInicio" id="dataInicio" th:value="${aluno.dataInicio}">
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaAlunos}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
