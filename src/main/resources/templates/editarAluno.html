<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Editar aluno | Oferta</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>
        <header class="topbar">
            <nav class="nav">
                <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
                <div class="nav-links">
                    <a th:href="@{/listaAlunos}">Ver alunos</a>
                    <a th:href="@{/}">Início</a>
                </div>
            </nav>
        </header>

        <main class="container">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Pessoas</p>
                    <h2>Editar aluno</h2>
                </div>
            </div>

            <section class="card form-card">
                <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

                <form th:action="@{/atualizarAluno}" method="post">
                    <input type="hidden" name="id" th:value="${aluno.id}">

                    <label for="nome">Informe o nome:</label>
                    <input type="text" th:name="nome" id="nome" th:value="${nome != null ? nome : aluno.nome}" required>

                    <label for="cpf">Informe o CPF:</label>
                    <input type="text" th:name="cpf" id="cpf" th:value="${cpf != null ? cpf : aluno.cpf}" inputmode="numeric" maxlength="14" pattern="[0-9.\-]{11,14}" title="Informe um CPF válido, com 11 dígitos." required>

                    <label for="email">Informe o e-mail:</label>
                    <input type="email" th:name="email" id="email" th:value="${email != null ? email : aluno.email}" required>

                    <label for="telefone">Informe o telefone:</label>
                    <input type="text" th:name="telefone" id="telefone" th:value="${telefone != null ? telefone : aluno.telefone}" required>

                    <label for="endereco">Informe o endereço:</label>
                    <input type="text" th:name="endereco" id="endereco" th:value="${endereco != null ? endereco : aluno.endereco}" required>

                    <label for="prontuario">Informe o prontuário:</label>
                    <input type="number" th:name="prontuario" id="prontuario" th:value="${prontuario != null ? prontuario : aluno.prontuario}" min="1" required>

                    <label for="dataInicio">Informe a data de início:</label>
                    <input type="date" th:name="dataInicio" id="dataInicio" th:value="${aluno.dataInicio}" readonly>

                    <div class="botoes">
                        <button type="submit">Salvar</button>
                        <a class="button secondary" th:href="@{/listaAlunos}">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
