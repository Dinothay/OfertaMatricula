<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Disciplina</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarDisciplina}" method="POST">
                    <input type="hidden" name="id" th:value="${disciplina.id}">

                    <div class="form-grid">
                        <div class="field full">
                            <label for="nome">Nome</label>
                            <input type="text" name="nome" id="nome" th:value="${disciplina.nome}" required>
                        </div>

                        <div class="field">
                            <label for="semestre">Semestre</label>
                            <input type="number" name="semestre" id="semestre" th:value="${disciplina.semestre}" required>
                        </div>

                        <div class="field">
                            <label for="nAulas">Número de aulas</label>
                            <input type="number" name="nAulas" id="nAulas" th:value="${disciplina.nAulas}" required>
                        </div>

                        <div class="field full">
                            <label for="cHoraria">Carga horária</label>
                            <input type="number" name="cHoraria" id="cHoraria" step="0.01" th:value="${disciplina.cHoraria}" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaDisciplinas}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
</body>

</html>
