<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar disciplina | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaDisciplinas}">Ver disciplinas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Acadêmico</p>
                <h2>Editar disciplina</h2>
            </div>
        </div>

        <section class="card form-card">
            <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

            <form th:action="@{/atualizarDisciplina}" method="POST">
                <input type="hidden" name="id" th:value="${disciplina.id}">

                <label for="nome">Informe o nome:</label>
                <input type="text" name="nome" id="nome" th:value="${nome != null ? nome : disciplina.nome}" required>

                <label for="semestre">Informe o semestre:</label>
                <input type="number" name="semestre" id="semestre" th:value="${semestre != null ? semestre : disciplina.semestre}" required>

                <label for="nAulas">Informe o número de aulas:</label>
                <input type="number" name="nAulas" id="nAulas" th:value="${nAulas != null ? nAulas : disciplina.nAulas}" required>

                <label for="cHoraria">Informe a carga horária:</label>
                <input type="number" name="cHoraria" id="cHoraria" step="0.01" th:value="${cHoraria != null ? cHoraria : disciplina.cHoraria}" required>

                <label for="cursoId">Selecione o curso:</label>
                <select name="cursoId" id="cursoId" required>
                    <option value="" disabled th:if="${cursoId == null and (disciplina.curso == null)}">-- selecione um curso --</option>
                    <option th:each="curso : ${cursos}" th:value="${curso.id}"
                            th:text="${curso.nome}"
                            th:selected="${cursoId != null} ? ${curso.id} == ${cursoId} : (${disciplina.curso != null} ? ${disciplina.curso.id} == ${curso.id} : false)"></option>
                </select>

                <div class="botoes">
                    <button type="submit">Salvar</button>
                    <a class="button secondary" th:href="@{/listaDisciplinas}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
