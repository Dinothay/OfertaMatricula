<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Disciplina | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaDisciplinas}">Ver disciplinas</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Nova disciplina</h2>
                    <p class="subtitle">Adicione uma disciplina ao sistema.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaDisciplinas}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>
            <form th:action="@{/cadastrarDisciplinas}" method="POST">
                <label for="nome">Informe o nome:</label>
                <input type="text" name="nome" id="nome" placeholder="Digite o nome da disciplina" th:value="${nome}" required>

                <label for="semestre">Informe o semestre:</label>
                <input type="number" name="semestre" id="semestre" placeholder="Semestre da disciplina" th:value="${semestre}" required>

                <label for="nAulas">Informe o número de aulas:</label>
                <input type="number" name="nAulas" id="nAulas" placeholder="Total de aulas" th:value="${nAulas}" required>

                <label for="cHoraria">Informe a carga horária:</label>
                <input type="number" name="cHoraria" id="cHoraria" step="0.01" placeholder="Ex: 60.00" th:value="${cHoraria}" required>

                <label for="cursoId">Selecione o curso:</label>
                <select name="cursoId" id="cursoId" required>
                    <option value="" disabled th:if="${cursoId == null}">-- selecione um curso --</option>
                    <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nome}"
                            th:selected="${cursoId != null} ? ${curso.id} == ${cursoId} : false"></option>
                </select>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaDisciplinas}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
