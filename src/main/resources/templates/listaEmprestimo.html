<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/listaLivro}">Livros</a>
                <a th:href="@{/listaExemplar}">Exemplares</a>
                <a th:href="@{/listaReserva}">Reservas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Empréstimos</h2>
                <p class="subtitle">Registros de retirada e devolução.</p>
            </div>
            <a class="button" th:href="@{/emprestimo}">+ Novo empréstimo</a>
        </div>

        <div th:if="${#lists.isEmpty(listaEmprestimo)}" class="empty-state">
            <h2>Nenhum empréstimo cadastrado</h2>
            <p>Cadastre o primeiro empréstimo para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaEmprestimo)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data retirada</th>
                        <th>Data prevista</th>
                        <th>Data devolução</th>
                        <th>Status</th>
                        <th>Renovações</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emprestimo : ${listaEmprestimo}">
                        <td th:text="${emprestimo.id}"></td>
                        <td th:text="${emprestimo.dataRetirada}"></td>
                        <td th:text="${emprestimo.dataPrevista}"></td>
                        <td th:text="${emprestimo.dataDevolucao}"></td>
                        <td th:text="${emprestimo.status}"></td>
                        <td th:text="${emprestimo.renovacoes}"></td>
                        <td>
                            <div class="actions">
                                <a class="button secondary" th:href="@{/editarEmprestimo/{id}(id=${emprestimo.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirEmprestimo/{id}(id=${emprestimo.id})}">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
