<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Empréstimos</title>
    <link rel="stylesheet" th:href="@{/css/lista.css}">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">Lista de Empréstimos</div>
            <div class="nav-actions">
                <a th:href="@{/biblioteca}" class="btn btn-secondary">Voltar à biblioteca</a>
                <a th:href="@{/emprestimo}" class="btn btn-primary">Cadastrar empréstimo</a>
            </div>
        </header>

        <div th:if="${#lists.isEmpty(listaEmprestimo)}" class="empty-state">
            <h2>Nenhum empréstimo cadastrado</h2>
            <p>Cadastre o primeiro empréstimo para continuar.</p>
        </div>

        <div th:unless="${#lists.isEmpty(listaEmprestimo)}" class="table-wrap">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data retirada</th>
                        <th>Data prevista</th>
                        <th>Data devolução</th>
                        <th>Status</th>
                        <th>Renovações</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emprestimo : ${listaEmprestimo}">
                        <td th:text="${emprestimo.id}"></td>
                        <td th:text="${emprestimo.dataRetirada}"></td>
                        <td th:text="${emprestimo.dataPrevista}"></td>
                        <td th:text="${emprestimo.dataDevolucao}"></td>
                        <td th:text="${emprestimo.status}"></td>
                        <td th:text="${emprestimo.renovacoes}"></td>
                        <td>
                            <div class="actions-inline">
                                <form th:action="@{/editarEmprestimo/{id}(id=${emprestimo.id})}" method="GET">
                                    <button type="submit" class="btn btn-secondary">Editar</button>
                                </form>
                                <form th:action="@{/excluirEmprestimo/{id}(id=${emprestimo.id})}" method="GET">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
