<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Exemplar | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaExemplar}">Ver exemplares</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Editar exemplar</h2>
                <p class="subtitle">Atualize o tombo e o vínculo do exemplar.</p>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarExemplar}" th:method="POST">
                <input type="hidden" name="id" th:value="${exemplar.id}">

                <label for="tombo">Tombo:</label>
                <input type="text" name="tombo" id="tombo" th:value="${exemplar.tombo}" required>

                <label for="idEmprestimo">Empréstimo:</label>
                <select name="idEmprestimo" id="idEmprestimo" required>
                    <option value="">Selecione o empréstimo</option>
                    <option th:each="emprestimo : ${emprestimos}"
                            th:value="${emprestimo.id}"
                            th:text="${emprestimo.status + ' - ' + emprestimo.dataRetirada}"
                            th:selected="${exemplar.status != null and exemplar.status.id == emprestimo.id}"></option>
                </select>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaExemplar}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
