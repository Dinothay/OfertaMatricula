<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Exemplar | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <header class="topbar">
        <nav class="nav">

            <a class="brand" th:href="@{/}">
                <span class="brand-mark">O</span> Oferta
            </a>

            <div class="nav-links">
                <a th:href="@{/listaExemplar}">Ver exemplares</a>
                <a th:href="@{/index}">Início</a>
            </div>

                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">

        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Biblioteca</p>
                    <h2>Editar exemplar</h2>
                    <p class="subtitle">Atualize as informações do exemplar.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaExemplar}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">

            <form th:action="@{/atualizarExemplar}" method="POST">

                <input type="hidden" name="id" th:value="${exemplar.id}">

                <label for="tombo">Tombo:</label>

                <input type="text" name="tombo" id="tombo" th:value="${exemplar.tombo}" required>

                <label for="status">Status do exemplar:</label>

                <select name="status" id="status" required>

                    <option value="">Selecione o status</option>

                    <option th:each="status : ${T(com.example.OfertaMatricula.Model.StatusExemplar).values()}"
                        th:value="${status}" th:text="${status}" th:selected="${exemplar.status == status}">
                    </option>

                </select>

                <label for="idLivro">Livro:</label>

                <select name="idLivro" id="idLivro" required>

                    <option value="">Selecione um livro</option>

                    <option th:each="livro : ${livros}" th:value="${livro.id}" th:text="${livro.titulo}"
                        th:selected="${exemplar.livro != null and exemplar.livro.id == livro.id}">
                    </option>

                </select>

                <div class="botoes">

                    <button type="submit">
                        Atualizar
                    </button>

                    <a class="button secondary" th:href="@{/listaExemplar}">
                        Voltar
                    </a>

                </div>

            </form>

        </section>

    </main>

    <script th:src="@{/js/profile-menu.js}"></script>
</body>

</html>
