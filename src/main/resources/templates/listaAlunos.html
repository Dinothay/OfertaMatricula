<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Alunos | Oferta</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/aluno}">Novo aluno</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Pessoas</p>
                <h2>Alunos</h2>
                <p class="subtitle">Estudantes cadastrados no sistema.</p>
            </div>
            <a class="button" th:href="@{/aluno}">+ Novo aluno</a>
        </div>

        <div class="alert" th:if="${mensagem}" th:text="${mensagem}"></div>
        <div class="alert" th:if="${erro}" th:text="${erro}"></div>

        <div th:if="${#lists.isEmpty(listaAlunos)}" class="empty-state">
            <h2>Nenhum aluno cadastrado</h2>
            <p>Cadastre o primeiro aluno para começar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaAlunos)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Prontuário</th>
                    <th>Endereço</th>
                    <th>Data de início</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="aluno : ${listaAlunos}">
                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.cpf}"></td>
                    <td th:text="${aluno.email}"></td>
                    <td th:text="${aluno.telefone}"></td>
                    <td th:text="${aluno.prontuario}"></td>
                    <td th:text="${aluno.endereco}"></td>
                    <td th:text="${aluno.dataInicio}"></td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarAluno/{id}(id=${aluno.id})}">Editar</a>
                            <a class="button danger" th:href="@{/excluirAluno/{id}(id=${aluno.id})}">Excluir</a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>
</body>

</html>
