<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Alunos | Oferta</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/aluno}">Novo aluno</a>
                <a th:href="@{/}">Início</a>
            </div>

            <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Pessoas</p>
                <h2>Alunos</h2>
                <p class="subtitle">Estudantes cadastrados no sistema.</p>
            </div>
            <a class="button" th:href="@{/aluno}">+ Novo aluno</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaAlunos)}" class="empty-state">
            <h2>Nenhum aluno cadastrado</h2>
            <p>Cadastre o primeiro aluno para começar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaAlunos)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Prontuário</th>
                    <th>Endereço</th>
                    <th>Data de início</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="aluno : ${listaAlunos}">
                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.cpf}"></td>
                    <td th:text="${aluno.email}"></td>
                    <td th:text="${aluno.telefone}"></td>
                    <td th:text="${aluno.prontuario}"></td>
                    <td th:text="${aluno.endereco}"></td>
                    <td th:text="${#temporals.format(aluno.dataInicio, 'dd/MM/yyyy')}"></td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarAluno/{id}(id=${aluno.id})}">Editar</a>
                            <a class="button danger" th:href="@{/excluirAluno/{id}(id=${aluno.id})}">Excluir</a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">← Voltar</a>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>

</html>
