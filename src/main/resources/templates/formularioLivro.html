<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livro | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaLivro}">Ver livros</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Novo livro</h2>
                <p class="subtitle">Adicione um novo item ao acervo.</p>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/cadastraLivro}" method="POST" enctype="multipart/form-data">
                <label for="titulo">Informe o título:</label>
                <input type="text" name="titulo" id="titulo" placeholder="Digite o título do livro" required>

                <label for="autor">Informe o autor:</label>
                <input type="text" name="autor" id="autor" placeholder="Digite o autor" required>

                <label for="isbn">Informe o ISBN:</label>
                <input type="text" name="isbn" id="isbn" placeholder="Digite o ISBN" required>

                <label for="edicao">Informe a edição:</label>
                <input type="text" name="edicao" id="edicao" placeholder="Digite a edição" required>

                <label for="capalmagem">Selecione a capa:</label>
                <input type="file" name="capalmagem" id="capalmagem" accept="image/*" required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaLivro}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
