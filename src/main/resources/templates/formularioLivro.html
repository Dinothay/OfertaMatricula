<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livro | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaLivro}">Ver livros</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Biblioteca</p>
                    <h2>Novo livro</h2>
                    <p class="subtitle">Adicione um novo item ao acervo.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaLivro}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/cadastraLivro}" method="POST" enctype="multipart/form-data">
                <label for="titulo">Informe o título:</label>
                <input type="text" name="titulo" id="titulo" placeholder="Digite o título do livro" required>

                <label for="autor">Informe o autor:</label>
                <input type="text" name="autor" id="autor" placeholder="Digite o autor" required>

                <label for="isbn">Informe o ISBN:</label>
                <input type="text" name="isbn" id="isbn" placeholder="Digite o ISBN" required>

                <label for="edicao">Informe a edição:</label>
                <input type="text" name="edicao" id="edicao" placeholder="Digite a edição" required>

                <label for="status">Status do livro:</label>
                <select name="status" id="status" required>
                    <option th:each="status : ${T(com.example.OfertaMatricula.Model.StatusLivro).values()}"
                            th:value="${status}" th:text="${status}"
                            th:selected="${status == T(com.example.OfertaMatricula.Model.StatusLivro).DISPONIVEL}"></option>
                </select>

                <label for="capalmagem">Selecione a capa:</label>
                <input type="file" name="capalmagem" id="capalmagem" accept="image/*" required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaLivro}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>

</html>
