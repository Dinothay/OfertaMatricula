<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Cadastrar Livro</h2>
            </div>
            <div class="form-body">
                <form th:action="@{/cadastraLivro}" method="POST">
                    <div class="form-grid">
                        <div class="field full">
                            <label for="titulo">Título</label>
                            <input type="text" name="titulo" id="titulo" placeholder="Digite o título do livro" required>
                        </div>
                        <div class="field">
                            <label for="autor">Autor</label>
                            <input type="text" name="autor" id="autor" placeholder="Digite o autor" required>
                        </div>
                        <div class="field">
                            <label for="isbn">ISBN</label>
                            <input type="text" name="isbn" id="isbn" placeholder="Digite o ISBN" required>
                        </div>
                        <div class="field">
                            <label for="edicao">Edição</label>
                            <input type="text" name="edicao" id="edicao" placeholder="Digite a edição" required>
                        </div>
                        <div class="field">
                            <label for="capalmagem">Capa</label>
                            <input type="text" name="capalmagem" id="capalmagem" placeholder="Insira a capa" required>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Criar</button>
                        <a th:href="@{/listaLivro}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
