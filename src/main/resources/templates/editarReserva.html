<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaReserva}">Ver reservas</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Biblioteca</p>
                    <h2>Editar reserva</h2>
                    <p class="subtitle">Atualize os dados da reserva.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaReserva}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarReserva}" th:method="POST">
                <input type="hidden" name="id" th:value="${reserva.id}">

                <label for="dataReserva">Data da reserva:</label>
                <input type="datetime-local" name="dataReserva" id="dataReserva" th:value="${reserva.dataReserva}" required>

                <label for="livroId">Livro reservado:</label>
                <select name="livroId" id="livroId" required>
                    <option th:each="livro : ${livros}" th:value="${livro.id}"
                            th:selected="${reserva.livro != null and reserva.livro.id == livro.id}"
                            th:text="${livro.titulo}"></option>
                </select>

                <label for="pessoaId">Aluno ou professor que reservou:</label>
                <select name="pessoaId" id="pessoaId" required>
                    <optgroup label="Alunos">
                        <option th:each="aluno : ${alunos}" th:value="${aluno.id}"
                                th:selected="${reserva.pessoa != null and reserva.pessoa.id == aluno.id}"
                                th:text="${aluno.nome + ' — ' + aluno.cpf}"></option>
                    </optgroup>
                    <optgroup label="Professores">
                        <option th:each="professor : ${professores}" th:value="${professor.id}"
                                th:selected="${reserva.pessoa != null and reserva.pessoa.id == professor.id}"
                                th:text="${professor.nome + ' — ' + professor.cpf}"></option>
                    </optgroup>
                </select>

                <label>Posição na fila:</label>
                <input type="text" th:value="${reserva.posicaoFila}" disabled>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaReserva}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
