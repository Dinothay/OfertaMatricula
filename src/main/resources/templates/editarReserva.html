<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Reserva</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarReserva}" th:method="POST">
                    <input type="hidden" name="id" th:value="${reserva.id}">

                    <div class="form-grid">
                        <div class="field">
                            <label for="dataReserva">Data da reserva</label>
                            <input type="datetime-local" name="dataReserva" id="dataReserva" th:value="${reserva.dataReserva}" required>
                        </div>

                        <div class="field">
                            <label for="posicaoFila">Posição na fila</label>
                            <input type="number" name="posicaoFila" id="posicaoFila" th:value="${reserva.posicaoFila}" required>
                        </div>

                        <div class="field full">
                            <label for="status">Status</label>
                            <input type="text" name="status" id="status" th:value="${reserva.status}" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaReserva}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
