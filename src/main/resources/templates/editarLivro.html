<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaLivro}">Ver livros</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Editar livro</h2>
                <p class="subtitle">Atualize as informações do item cadastrado.</p>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarLivro}" th:method="POST" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${livro.id}">

                <label for="titulo">Título:</label>
                <input type="text" name="titulo" id="titulo" th:value="${livro.titulo}" required>

                <label for="autor">Autor:</label>
                <input type="text" name="autor" id="autor" th:value="${livro.autor}" required>

                <label for="isbn">ISBN:</label>
                <input type="text" name="isbn" id="isbn" th:value="${livro.isbn}" required>

                <label for="edicao">Edição:</label>
                <input type="text" name="edicao" id="edicao" th:value="${livro.edicao}" required>

                <label>Capa atual:</label>
                <img th:src="@{'/' + ${livro.capalmagem}}" alt="Capa do livro" style="width: 150px; height: 200px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 8px;">

                <label for="capalmagem">Nova capa:</label>
                <input type="file" name="capalmagem" id="capalmagem" accept="image/*">

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaLivro}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
