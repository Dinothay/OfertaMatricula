<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="page">
        <div class="form-shell">
            <div class="form-header">
                <h2>Editar Livro</h2>
            </div>

            <div class="form-body">
                <form th:action="@{/atualizarLivro}" th:method="POST">
                    <input type="hidden" name="id" th:value="${livro.id}">

                    <div class="form-grid">
                        <div class="field full">
                            <label for="titulo">Título</label>
                            <input type="text" name="titulo" id="titulo" th:value="${livro.titulo}" required>
                        </div>

                        <div class="field">
                            <label for="autor">Autor</label>
                            <input type="text" name="autor" id="autor" th:value="${livro.autor}" required>
                        </div>

                        <div class="field">
                            <label for="isbn">ISBN</label>
                            <input type="text" name="isbn" id="isbn" th:value="${livro.isbn}" required>
                        </div>

                        <div class="field">
                            <label for="edicao">Edição</label>
                            <input type="text" name="edicao" id="edicao" th:value="${livro.edicao}" required>
                        </div>

                        <div class="field">
                            <label for="capalmagem">Capalmagem</label>
                            <input type="text" name="capalmagem" id="capalmagem" th:value="${livro.capalmagem}"
                                required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                        <a th:href="@{/listaLivro}" class="btn btn-secondary">Ir para lista</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
