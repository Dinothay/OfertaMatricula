<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Matrícula | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaMatricula}">Ver matrículas</a>
                <a th:href="@{/index}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Nova matrícula</h2>
                    <p class="subtitle">Registre a matrícula do aluno.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaMatricula}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/cadastrarMatriculas}" method="POST">
                <label for="idAluno">Aluno:</label>
                <select name="idAluno" id="idAluno" required>
                    <option value="">Selecione um aluno</option>
                    <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                </select>

                <label for="idCurso">Curso:</label>
                <select name="idCurso" id="idCurso" required>
                    <option value="">Selecione um curso</option>
                    <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nome}"></option>
                </select>

                <label for="idOfertaDisciplina">Oferta da disciplina:</label>
                <select name="idOfertaDisciplina" id="idOfertaDisciplina" required>
                    <option value="">Selecione uma oferta</option>
                    <option th:each="oferta : ${ofertas}" th:value="${oferta.id}" th:text="${oferta.disciplina.nome + ' - ' + oferta.professor.nome}"></option>
                </select>

                <label for="dataM">Data da matrícula:</label>
                <input type="date" name="dataM" id="dataM"
                       th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                       readonly required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaMatricula}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
