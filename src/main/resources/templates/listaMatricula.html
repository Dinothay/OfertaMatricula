<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Matrículas</title>
    <link rel="stylesheet" th:href="@{/css/lista.css}">
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">Lista de Matrículas</div>
            <div class="nav-actions">
                <a th:href="@{/index}" class="btn btn-secondary">Voltar ao início</a>
                <a th:href="@{/matricula}" class="btn btn-primary">+ Cadastrar matrícula</a>
            </div>
        </header>

        <div th:if="${mensagem}" class="alert">
            <p th:text="${mensagem}"></p>
        </div>

        <div th:if="${#lists.isEmpty(listaMatricula)}" class="empty-state">
            <h2>Nenhuma matrícula cadastrada</h2>
            <p>Realize a primeira matrícula para acompanhar os registros.</p>
        </div>

        <div th:unless="${#lists.isEmpty(listaMatricula)}" class="table-wrap">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Aluno</th>
                        <th>Curso</th>
                        <th>Disciplina</th>
                        <th>Professor</th>
                        <th>Dia da aula</th>
                        <th>Aulas por semana</th>
                        <th>Data da matrícula</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="matricula : ${listaMatricula}">
                        <td th:text="${matricula.id}"></td>
                        <td th:text="${matricula.aluno.nome}"></td>
                        <td th:text="${matricula.curso.nome}"></td>
                        <td th:text="${matricula.ofertaDisciplina.disciplina.nome}"></td>
                        <td th:text="${matricula.ofertaDisciplina.professor.nome}"></td>
                        <td th:text="${matricula.ofertaDisciplina.diaAula}"></td>
                        <td th:text="${matricula.ofertaDisciplina.nAulaSemana}"></td>
                        <td th:text="${matricula.dataM}"></td>
                        <td>
                            <div class="actions-inline">
                                <form th:action="@{/editarMatricula/{id}(id=${matricula.id})}" method="GET">
                                    <button type="submit" class="btn btn-secondary">Editar</button>
                                </form>
                                <form th:action="@{/excluirMatricula/{id}(id=${matricula.id})}" method="GET">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
