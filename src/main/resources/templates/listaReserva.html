<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/listaLivro}">Livros</a>
                <a th:href="@{/listaExemplar}">Exemplares</a>
                <a th:href="@{/listaEmprestimo}">Empréstimos</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Biblioteca</p>
                <h2>Reservas</h2>
                <p class="subtitle">Fila de solicitações aguardando atendimento.</p>
            </div>
            <a class="button" th:href="@{/reserva}">+ Nova reserva</a>
        </div>

        <div th:if="${#lists.isEmpty(listaReserva)}" class="empty-state">
            <h2>Nenhuma reserva cadastrada</h2>
            <p>Cadastre a primeira reserva para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaReserva)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data da reserva</th>
                        <th>Posição na fila</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reserva : ${listaReserva}">
                        <td th:text="${reserva.id}"></td>
                        <td th:text="${#temporals.format(reserva.dataReserva, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${reserva.posicaoFila}"></td>
                        <td th:text="${reserva.status}"></td>
                        <td>
                            <div class="actions">
                                <a class="button secondary" th:href="@{/editarReserva/{id}(id=${reserva.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirReserva/{id}(id=${reserva.id})}">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/biblioteca}">⬅ Voltar</a>
</body>
</html>
