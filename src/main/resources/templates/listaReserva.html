<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Reservas</title>
    <link rel="stylesheet" th:href="@{/css/lista.css}">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">Lista de Reservas</div>
            <div class="nav-actions">
                <a th:href="@{/biblioteca}" class="btn btn-secondary">Voltar à biblioteca</a>
                <a th:href="@{/reserva}" class="btn btn-primary">Cadastrar reserva</a>
            </div>
        </header>

        <div th:if="${#lists.isEmpty(listaReserva)}" class="empty-state">
            <h2>Nenhuma reserva cadastrada</h2>
            <p>Cadastre a primeira reserva para continuar.</p>
        </div>

        <div th:unless="${#lists.isEmpty(listaReserva)}" class="table-wrap">
            <table class="records-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data da reserva</th>
                        <th>Posição na fila</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reserva : ${listaReserva}">
                        <td th:text="${reserva.id}"></td>
                        <td th:text="${reserva.dataReserva}"></td>
                        <td th:text="${reserva.posicaoFila}"></td>
                        <td th:text="${reserva.status}"></td>
                        <td>
                            <div class="actions-inline">
                                <form th:action="@{/editarReserva/{id}(id=${reserva.id})}" method="GET">
                                    <button type="submit" class="btn btn-secondary">Editar</button>
                                </form>
                                <form th:action="@{/excluirReserva/{id}(id=${reserva.id})}" method="GET">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
