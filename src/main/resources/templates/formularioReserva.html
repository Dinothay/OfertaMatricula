<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Reserva | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaReserva}">Ver reservas</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Biblioteca</p>
                    <h2>Nova reserva</h2>
                    <p class="subtitle">Cadastre uma solicitação de material.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaReserva}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/cadastraReserva}" method="POST">
                <label for="dataReserva">Data da reserva:</label>
                <input type="datetime-local" name="dataReserva" id="dataReserva" required>

                <label for="posicaoFila">Posição na fila:</label>
                <input type="number" name="posicaoFila" id="posicaoFila" placeholder="Digite a posição" required>

                <label for="status">Status:</label>
                <input type="text" name="status" id="status" placeholder="Digite o status" required>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <a class="button secondary" th:href="@{/listaReserva}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
