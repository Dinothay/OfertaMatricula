<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/curso}">Novo curso</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Acadêmico</p>
                <h2>Cursos</h2>
                <p class="subtitle">Cursos cadastrados no sistema.</p>
            </div>
            <a class="button" th:href="@{/curso}">+ Novo curso</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaCursos)}" class="empty-state">
            <h2>Nenhum curso cadastrado</h2>
            <p>Cadastre o primeiro curso para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaCursos)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Semestres</th>
                    <th>Número de disciplinas</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="curso : ${listaCursos}">
                    <td th:text="${curso.id}"></td>
                    <td th:text="${curso.nome}"></td>
                    <td th:text="${curso.semestres}"></td>
                    <td th:text="${curso.nDisciplinas}"></td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarCurso/{id}(id=${curso.id})}">Editar</a>
                            <a class="button danger" th:href="@{/excluirCurso/{id}(id=${curso.id})}">Excluir</a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">⬅ Voltar</a>
</body>
</html>
