<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Matrícula | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaMatricula}">Ver matrículas</a>
                <a th:href="@{/index}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Editar matrícula</h2>
                    <p class="subtitle">Atualize os dados da matrícula.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaMatricula}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarMatricula}" method="POST">
                <input type="hidden" name="id" th:value="${matricula.id}">

                <label for="idAluno">Aluno:</label>
                <select name="idAluno" id="idAluno" required>
                    <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"
                        th:selected="${aluno.id == matricula.aluno.id}">
                    </option>
                </select>

                <label for="idCurso">Curso:</label>
                <select name="idCurso" id="idCurso" required>
                    <option th:each="curso : ${cursos}" th:value="${curso.id}" th:text="${curso.nome}"
                        th:selected="${curso.id == matricula.curso.id}">
                    </option>
                </select>

                <label for="idOfertaDisciplina">Oferta da disciplina:</label>
                <select name="idOfertaDisciplina" id="idOfertaDisciplina" required>
                    <option th:each="oferta : ${ofertas}" th:value="${oferta.id}"
                        th:text="${oferta.disciplina.nome + ' - ' + oferta.professor.nome}"
                        th:selected="${oferta.id == matricula.ofertaDisciplina.id}">
                    </option>
                </select>

                <label for="dataM">Data da matrícula:</label>
                <input type="date" name="dataM" id="dataM" th:value="${matricula.dataM}" readonly>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaMatricula}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
