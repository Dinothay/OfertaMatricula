<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas de disciplinas | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/ofertaDisciplina}">Nova oferta</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Acadêmico</p>
                <h2>Ofertas de disciplinas</h2>
                <p class="subtitle">Ofertas cadastradas no sistema.</p>
            </div>
            <a class="button" th:href="@{/ofertaDisciplina}">+ Nova oferta</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaOfertaDisciplinas)}" class="empty-state">
            <h2>Nenhuma oferta cadastrada</h2>
            <p>Cadastre a primeira oferta para organizar as aulas.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaOfertaDisciplinas)}" class="card table-wrap">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Disciplina</th>
                    <th>Professor</th>
                    <th>Dia da aula</th>
                    <th>Aulas por semana</th>
                    <th>Ações</th>
                </tr>

                <tr th:each="oferta : ${listaOfertaDisciplinas}">
                    <td th:text="${oferta.id}"></td>
                    <td th:text="${oferta.disciplina.nome}"></td>
                    <td th:text="${oferta.professor.nome}"></td>
                    <td th:text="${oferta.diaAula}"></td>
                    <td th:text="${oferta.nAulaSemana}"></td>
                    <td>
                        <div class="actions">
                            <a class="button secondary" th:href="@{/editarOfertaDisciplina/{id}(id=${oferta.id})}">Editar</a>
                            <a class="button danger" th:href="@{/excluirOfertaDisciplina/{id}(id=${oferta.id})}">Excluir</a>
                        </div>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">⬅ Voltar</a>
</body>
</html>
