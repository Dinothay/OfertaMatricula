<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Prova | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaProva}">Ver provas</a>
                <a th:href="@{/}">Início</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading centered">
            <div>
                <p class="eyebrow">Acadêmico</p>
                <h2>Editar prova</h2>
                <p class="subtitle">Atualize os detalhes da avaliação.</p>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarProva}" th:method="POST">
                <input type="hidden" name="id" th:value="${prova.id}">

                <label for="data">Data:</label>
                <input type="date" name="data" id="data" th:value="${prova.data}" required>

                <label for="peso">Peso:</label>
                <input type="number" step="0.01" name="peso" id="peso" th:value="${prova.peso}" required>

                <label for="conteudo">Conteúdo:</label>
                <input type="text" name="conteudo" id="conteudo" th:value="${prova.conteudo}" required>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaProva}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
