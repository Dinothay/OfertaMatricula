<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Prova | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/listaProva}">Ver provas</a>
                <a th:href="@{/}">Início</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-header-shell">
            <div class="page-heading centered">
                <div>
                    <p class="eyebrow">Acadêmico</p>
                    <h2>Editar prova</h2>
                    <p class="subtitle">Atualize os detalhes da avaliação.</p>
                </div>
                <div class="page-actions">
                    <a class="button secondary" th:href="@{/listaProva}">Voltar</a>
                </div>
            </div>
        </div>

        <section class="card form-card">
            <form th:action="@{/atualizarProva}" th:method="POST">
                <input type="hidden" name="id" th:value="${prova.id}">

                <label for="disciplinaId">Disciplina:</label>
                <select name="disciplinaId" id="disciplinaId" required>
                    <option value="">Selecione a disciplina</option>
                    <option th:each="disciplina : ${disciplinas}"
                            th:value="${disciplina.id}"
                            th:text="${disciplina.nome}"
                            th:selected="${prova.disciplina != null and prova.disciplina.id == disciplina.id}">
                    </option>
                </select>

                <label for="data">Data:</label>
                <input type="date" name="data" id="data" th:value="${prova.data}" required>

                <label for="peso">Peso:</label>
                <input type="number" step="0.01" name="peso" id="peso" th:value="${prova.peso}" required>

                <label for="conteudo">Conteúdo:</label>
                <input type="text" name="conteudo" id="conteudo" th:value="${prova.conteudo}" required>

                <label>Livros relacionados:</label>
                <div class="checkbox-list" th:if="${!#lists.isEmpty(livros)}">
                    <label class="checkbox-item" th:each="livro : ${livros}">
                        <input type="checkbox" name="livroIds" th:value="${livro.id}"
                               th:checked="${livroIdsSelecionados != null and livroIdsSelecionados.contains(livro.id)}" />
                        <span th:text="${livro.titulo}"></span>
                    </label>
                </div>
                <p th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado no sistema.</p>

                <div class="botoes">
                    <button type="submit">Atualizar</button>
                    <a class="button secondary" th:href="@{/listaProva}">Voltar</a>
                </div>
            </form>
        </section>
    </main>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
