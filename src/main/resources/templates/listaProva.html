<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provas | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/}">Início</a>
                <a th:href="@{/listaMatricula}">Matrículas</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Academico</p>
                <h2>Provas</h2>
                <p class="subtitle">Registro de avaliações e pesos.</p>
            </div>
            <a class="button" th:href="@{/prova}">+ Nova prova</a>
        </div>

        <div th:if="${#lists.isEmpty(listaProva)}" class="empty-state">
            <h2>Nenhuma prova cadastrada</h2>
            <p>Cadastre a primeira prova para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaProva)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Conteúdo</th>
                        <th>Peso</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prova : ${listaProva}">
                        <td th:text="${prova.id}"></td>
                        <td th:text="${prova.data}"></td>
                        <td th:text="${prova.conteudo}"></td>
                        <td th:text="${prova.peso}"></td>
                        <td>
                            <div class="actions">
                                <a class="button secondary" th:href="@{/editarProva/{id}(id=${prova.id})}">Editar</a>
                                <a class="button danger" th:href="@{/excluirProva/{id}(id=${prova.id})}">Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">⬅ Voltar</a>
</body>
</html>
