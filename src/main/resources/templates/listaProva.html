<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provas | Oferta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" th:href="@{/}"><span class="brand-mark">O</span> Oferta</a>
            <div class="nav-links">
                <a th:href="@{/}">Início</a>
                <a th:href="@{/listaMatricula}">Matrículas</a>
                <a th:href="@{/biblioteca}">Biblioteca</a>
            </div>
                    <div class="nav-actions">
                <div class="user-chip" th:if="${usuarioLogado != null}">
                    <button type="button" class="user-chip-trigger" aria-expanded="false" aria-haspopup="true">
                        <span class="user-status-dot"></span>
                        <img th:if="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}"
                             th:src="${usuarioLogado.fotoPerfil.startsWith('/') ? usuarioLogado.fotoPerfil : '/' + usuarioLogado.fotoPerfil}"
                             alt="Foto de perfil"
                             class="user-avatar" />
                        <div class="user-avatar user-avatar-fallback"
                             th:unless="${usuarioLogado.fotoPerfil != null and !usuarioLogado.fotoPerfil.isEmpty()}">U</div>
                        <div class="user-info">
                            <strong th:text="${usuarioLogado.username}">Usuário</strong>
                            <small>Online</small>
                        </div>
                    </button>

                    <div class="user-menu">
                        <a class="user-menu-item" th:href="@{/meuPerfil}">Meu perfil</a>
                        <a class="user-menu-item" th:href="@{/editarUsuario/{id}(id=${usuarioLogado.id})}">Editar perfil</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-menu-item logout-button">Sair da conta</button>
                        </form>
                    </div>
                </div>
                <a th:unless="${usuarioLogado != null}" class="login-link" th:href="@{/login}">Entrar</a>
            </div>
            </nav>
    </header>

    <main class="container">
        <div class="page-heading">
            <div>
                <p class="eyebrow">Academico</p>
                <h2>Provas</h2>
                <p class="subtitle">Registro de avaliações e pesos.</p>
            </div>
            <a th:if="${usuarioLogado != null and (usuarioLogado.papel.name() == 'ADMIN' or usuarioLogado.papel.name() == 'PROFESSOR')}" class="button" th:href="@{/prova}">+ Nova prova</a>
        </div>

        <div th:if="${mensagem}" th:class="${mensagemTipo == 'sucesso'} ? 'alert alert-success' : 'alert alert-error'" th:text="${mensagem}"></div>

        <div th:if="${#lists.isEmpty(listaProva)}" class="empty-state">
            <h2>Nenhuma prova cadastrada</h2>
            <p>Cadastre a primeira prova para continuar.</p>
        </div>

        <section th:unless="${#lists.isEmpty(listaProva)}" class="card table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Disciplina</th>
                        <th>Professor</th>
                        <th>Data</th>
                        <th>Conteúdo</th>
                        <th>Livros</th>
                        <th>Peso</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prova : ${listaProva}">
                        <td th:text="${prova.id}"></td>
                        <td th:text="${prova.disciplina != null ? prova.disciplina.nome : '—'}"></td>
                        <td th:text="${prova.professor != null ? prova.professor.nome : '—'}"></td>
                        <td th:text="${#temporals.format(prova.data, 'dd/MM/yyyy')}"></td>
                        <td th:text="${prova.conteudo}"></td>
                        <td>
                            <span th:if="${prova.livros != null and !#lists.isEmpty(prova.livros)}"
                                  th:text="${#strings.listJoin(prova.livros.![titulo], ', ')}"></span>
                            <span th:unless="${prova.livros != null and !#lists.isEmpty(prova.livros)}">—</span>
                        </td>
                        <td th:text="${prova.peso}"></td>
                        <td>
                            <div th:if="${usuarioLogado != null and (usuarioLogado.papel.name() == 'ADMIN' or (usuarioLogado.papel.name() == 'PROFESSOR' and prova.professor != null and usuarioLogado.pessoa != null and usuarioLogado.pessoa.id == prova.professor.id))}" class="actions">
                                <form th:action="@{/editarProva/{id}(id=${prova.id})}" method="get" style="display: inline;">
                                    <button type="submit" class="button secondary">Editar</button>
                                </form>
                                <form th:action="@{/excluirProva/{id}(id=${prova.id})}" method="get" style="display: inline;">
                                    <button type="submit" class="button danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <a class="floating-back-btn" th:href="@{/}">← Voltar</a>
    <script th:src="@{/js/profile-menu.js}"></script>
</body>
</html>
