<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Oferta de Disciplina</title>
</head>

<body>
    <h3>Cadastrar Oferta de Disciplina</h3>
    <form th:action="@{/cadastrarOfertaDisciplinas}" method="POST">
        <div class="campo">
            <label for="idDisciplina">Disciplina</label>
            <select name="idDisciplina" id="idDisciplina">
                <option value="">Selecione uma disciplina</option>
                <option th:each="disciplina : ${disciplinas}" th:value="${disciplina.id}" th:text="${disciplina.nome}">
                </option>
            </select>
        </div>
        <div class="campo">
            <label for="idProfessor">Professor</label>
            <select name="idProfessor" id="idProfessor">
                <option value="">Selecione um professor</option>
                <option th:each="professor : ${professores}" th:value="${professor.id}" th:text="${professor.nome}">
                </option>
            </select>
        </div>
        <div class="campo">
            <label for="diaAula">Dia da aula</label>
            <select name="diaAula" id="diaAula">
                <option value="Segunda-feira">Segunda-feira</option>
                <option value="Terça-feira">Terça-feira</option>
                <option value="Quarta-feira">Quarta-feira</option>
                <option value="Quinta-feira">Quinta-feira</option>
                <option value="Sexta-feira">Sexta-feira</option>
                <option value="Sábado">Sábado</option>
            </select>
        </div>
        <div class="campo">
            <label for="nAulaSemana">Número de aulas por semana</label>
            <input type="number" name="nAulaSemana" id="nAulaSemana" min="1">
        </div>
        <button type="submit">Cadastrar</button>
    </form>
    <form th:action="@{/listaOfertaDisciplinas}" method="GET">
        <button type="submit">Ir para lista de ofertas</button>
    </form>

</body>

</html>
